<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D HH Goa Summoning Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #0a2e1b 0%, #02140c 100%);
      color: #fff;
      font-family: 'Space Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 3D Scene */
    .scene {
      width: 400px;
      height: 400px;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
    }

    .watch {
      position: relative;
      width: 250px;
      height: 250px;
      transform-style: preserve-3d;
      transform: rotateX(25deg) rotateZ(-15deg);
      transition: transform 0.5s ease;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: rotateX(25deg) rotateZ(-15deg) translateY(0px); }
      50% { transform: rotateX(30deg) rotateZ(-10deg) translateY(-20px); }
    }

    .watch.summoning {
      animation: summon-spin 2s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    @keyframes summon-spin {
      0% { transform: rotateX(25deg) rotateZ(-15deg) scale(1); }
      50% { transform: rotateX(0deg) rotateZ(180deg) scale(1.2); }
      100% { transform: rotateX(10deg) rotateZ(360deg) scale(1.1); }
    }

    /* Watch Straps */
    .strap {
      position: absolute;
      width: 140px;
      height: 200px;
      background: linear-gradient(to bottom, #111, #222);
      left: 55px;
      border-radius: 10px;
      border: 4px solid #000;
      transform-style: preserve-3d;
    }
    .strap.top {
      top: -150px;
      transform: rotateX(-30deg);
      transform-origin: bottom center;
    }
    .strap.bottom {
      bottom: -150px;
      transform: rotateX(30deg);
      transform-origin: top center;
    }

    /* Watch Body */
    .watch-body {
      position: absolute;
      inset: 0;
      background: #111;
      border-radius: 50%;
      border: 15px solid #051a0e;
      box-shadow: 
        0 15px 35px rgba(0,0,0,0.8), 
        inset 0 0 20px #000,
        0 0 0 4px #1a5c3a,
        0 0 40px rgba(26, 92, 58, 0.5);
      transform: translateZ(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
    }

    /* Glowing inner ring */
    .ring {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 8px solid #fee101;
      box-shadow: 0 0 20px #fee101, inset 0 0 20px #fee101;
      opacity: 0.8;
      pointer-events: none;
      transform: translateZ(5px);
    }
    
    .watch.summoning .ring {
      animation: pulse-glow 0.5s infinite alternate;
    }
    
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 20px #fee101, inset 0 0 20px #fee101; border-color: #fee101; }
      100% { box-shadow: 0 0 60px #83e02a, inset 0 0 60px #83e02a; border-color: #83e02a; }
    }

    /* Watch Face / Frame */
    .watch-face {
      position: absolute;
      inset: 25px;
      background: #000;
      border-radius: 50%;
      overflow: hidden;
      transform: translateZ(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #1a5c3a;
    }

    .watch-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s;
      mix-blend-mode: luminosity; /* gives a cool hologram vibe initially */
    }

    .watch-face img.active {
      opacity: 1;
      mix-blend-mode: normal;
    }

    .cross-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      clip-path: polygon(20% 0, 80% 0, 50% 40%, 80% 100%, 20% 100%, 50% 60%);
      background: rgba(2, 20, 12, 0.8);
      z-index: 10;
      transition: opacity 0.5s;
    }

    .watch.summoning .cross-pattern {
      opacity: 0;
    }

    /* Surrounding Frame Text */
    .frame-text {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotate-text 10s linear infinite;
      pointer-events: none;
      transform: translateZ(15px);
    }
    
    .frame-text span {
      position: absolute;
      left: 50%;
      top: 0;
      transform-origin: 0 125px; /* radius */
      color: #fee101;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 0 5px #fee101;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    @keyframes rotate-text {
      0% { transform: translateZ(15px) rotate(0deg); }
      100% { transform: translateZ(15px) rotate(360deg); }
    }

    /* Status & Controls */
    .status {
      font-size: 24px;
      color: #fee101;
      text-shadow: 0 0 10px rgba(254, 225, 1, 0.6);
      margin-bottom: 20px;
      height: 35px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 15px;
      z-index: 100;
    }

    .btn {
      background: rgba(26, 92, 58, 0.5);
      border: 1px solid #fee101;
      color: #fee101;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(254, 225, 1, 0.1);
    }

    .btn:hover {
      background: #fee101;
      color: #02140c;
      box-shadow: 0 0 20px rgba(254, 225, 1, 0.5);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #555;
      color: #555;
      background: #111;
      box-shadow: none;
    }

    #downloadBtn {
      display: none;
    }

    /* Flash */
    .flash {
      position: fixed;
      inset: 0;
      background: #83e02a;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
    }
    .flash.active {
      animation: screen-flash 1s ease-out forwards;
    }
    @keyframes screen-flash {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="status" id="statusText">Awaiting Builder Image...</div>

  <div class="scene">
    <div class="watch" id="watch">
      <div class="strap top"></div>
      <div class="strap bottom"></div>
      <div class="watch-body">
        <div class="ring"></div>
        <div class="watch-face">
          <div class="cross-pattern" id="crossPattern"></div>
          <img id="userImage" src="" alt="">
        </div>
        <!-- Circular Text Frame -->
        <div class="frame-text" id="frameText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <label for="imageUpload" class="btn">Upload Image</label>
    <input type="file" id="imageUpload" accept="image/*" hidden>
    
    <button class="btn" id="summonBtn" disabled>Summon</button>
    <button class="btn" id="downloadBtn">Generate Photo</button>
  </div>

  <div class="flash" id="flash"></div>

  <!-- Hidden canvas for generating the final photo -->
  <canvas id="genCanvas" width="800" height="800" style="display:none;"></canvas>

  <script>
    // Circular Text generation
    const textStr = "HACKER HOUSE GOA · BUILDER PASSPORT · ";
    const frameTextContainer = document.getElementById('frameText');
    const chars = textStr.split('');
    const angleStep = 360 / chars.length;
    
    chars.forEach((char, i) => {
      const span = document.createElement('span');
      span.innerText = char;
      span.style.transform = `rotate(${i * angleStep}deg) translateY(-105px)`;
      frameTextContainer.appendChild(span);
    });

    const imageUpload = document.getElementById('imageUpload');
    const userImage = document.getElementById('userImage');
    const summonBtn = document.getElementById('summonBtn');
    const statusText = document.getElementById('statusText');
    const watch = document.getElementById('watch');
    const flash = document.getElementById('flash');
    const crossPattern = document.getElementById('crossPattern');
    const downloadBtn = document.getElementById('downloadBtn');
    const genCanvas = document.getElementById('genCanvas');
    const ctx = genCanvas.getContext('2d');

    let uploadedImgObj = new Image();

    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        userImage.src = url;
        userImage.classList.remove('active');
        crossPattern.style.opacity = '1';
        
        uploadedImgObj.src = url;
        uploadedImgObj.onload = () => {
          summonBtn.disabled = false;
          statusText.innerText = "Target Locked. Ready to Summon.";
        }
      }
    });

    summonBtn.addEventListener('click', () => {
      summonBtn.disabled = true;
      statusText.innerText = "SUMMONING...";
      watch.classList.add('summoning');
      
      setTimeout(() => {
        flash.classList.add('active');
        userImage.classList.add('active');
        
        setTimeout(() => {
          statusText.innerText = "HACKER HOUSE GOA SUMMONED!";
          statusText.style.color = "#83e02a";
          downloadBtn.style.display = "inline-block";
        }, 500);
      }, 1000);
    });

    downloadBtn.addEventListener('click', () => {
      // Draw a cool ID card / Watch frame on canvas
      ctx.fillStyle = '#02140c';
      ctx.fillRect(0, 0, 800, 800);
      
      // Draw outer glowing ring
      ctx.beginPath();
      ctx.arc(400, 400, 350, 0, Math.PI * 2);
      ctx.fillStyle = '#1a5c3a';
      ctx.fill();
      
      ctx.beginPath();
      ctx.arc(400, 400, 330, 0, Math.PI * 2);
      ctx.strokeStyle = '#fee101';
      ctx.lineWidth = 15;
      ctx.stroke();

      // Draw the uploaded image as a circle
      ctx.save();
      ctx.beginPath();
      ctx.arc(400, 400, 300, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      
      // Calculate aspect ratio to cover the circle
      const size = Math.max(uploadedImgObj.width, uploadedImgObj.height);
      const scale = 600 / Math.min(uploadedImgObj.width, uploadedImgObj.height);
      const w = uploadedImgObj.width * scale;
      const h = uploadedImgObj.height * scale;
      ctx.drawImage(uploadedImgObj, 400 - w/2, 400 - h/2, w, h);
      ctx.restore();

      // Draw text around the canvas
      ctx.save();
      ctx.translate(400, 400);
      ctx.font = "bold 40px 'Space Mono', monospace";
      ctx.fillStyle = "#fee101";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      const radStep = (Math.PI * 2) / chars.length;
      for (let i = 0; i < chars.length; i++) {
        ctx.save();
        ctx.rotate(i * radStep);
        ctx.translate(0, -360);
        ctx.fillText(chars[i], 0, 0);
        ctx.restore();
      }
      ctx.restore();

      // Download
      const link = document.createElement('a');
      link.download = 'HH-Goa-Summoned.png';
      link.href = genCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
